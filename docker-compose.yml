# Run the portfolio locally in one command:  docker compose up   →  http://localhost:3000
# Your files are mounted live, so edits hot-reload. Env comes from .env.local in this folder.
services:
  portfolio:
    build: .
    command: sh -c "pnpm install --frozen-lockfile --store-dir /app/node_modules/.pnpm-store && pnpm dev --hostname 0.0.0.0"
    ports:
      - "3000:3000"
    environment:
      CI: "true" # lets pnpm run without interactive prompts
    volumes:
      - .:/app
      - node_modules:/app/node_modules # Linux packages, kept apart from your Mac's node_modules
      - next:/app/.next # Linux build cache, kept apart from your Mac's .next

volumes:
  node_modules:
  next:
